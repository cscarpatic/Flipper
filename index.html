<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flipper Realistico</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a12;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 4px;
      color: #ff6b35;
      text-shadow: 0 0 15px rgba(255,107,53,0.7);
      margin-bottom: 4px;
    }
    #hud {
      display: flex;
      gap: 28px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    #hud span { color: #4ecdc4; min-width: 40px; display: inline-block; }
    #game-wrap {
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      border-radius: 6px;
      border: 2px solid #333;
      overflow: hidden;
    }
    canvas { display: block; background: #0d1117; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(8,8,16,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay.hidden { display: none !important; }
    #overlay h2 {
      font-size: 2rem;
      color: #ff6b35;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(255,107,53,0.5);
    }
    #overlay p { margin: 6px 0; opacity: 0.9; font-size: 0.95rem; }
    #startBtn {
      margin-top: 22px;
      padding: 14px 36px;
      font-size: 1.15rem;
      font-weight: 700;
      background: #ff6b35;
      color: #111;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,107,53,0.4);
    }
    #startBtn:active { transform: scale(0.97); }
    #help {
      margin-top: 10px;
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
      max-width: 460px;
      line-height: 1.4;
    }
    kbd {
      background: #333;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid #555;
      font-family: monospace;
    }
    #mobile {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 0; right: 0;
      justify-content: space-evenly;
      z-index: 30;
      pointer-events: none;
    }
    #mobile button {
      pointer-events: auto;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: none;
      background: #e53e3e;
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    #mobile #mLaunch { background: #805ad5; }
    @media (max-width: 600px), (pointer: coarse) {
      #mobile { display: flex; }
      body { padding-bottom: 110px; }
      #help { display: none; }
    }
  </style>
</head>
<body>
  <h1>⚡ FLIPPER ⚡</h1>
  <div id="hud">
    <div>Punteggio: <span id="score">0</span></div>
    <div>Palline: <span id="balls">3</span></div>
    <div>Record: <span id="high">0</span></div>
  </div>

  <div id="game-wrap">
    <div id="overlay">
      <h2>FLIPPER REALISTICO</h2>
      <p>Tieni premuto <kbd>SPAZIO</kbd> per caricare<br>poi rilascia per lanciare</p>
      <p>Flipper: <kbd>Z</kbd> / <kbd>←</kbd> e <kbd>X</kbd> / <kbd>→</kbd></p>
      <button id="startBtn">INIZIA</button>
    </div>
  </div>

  <div id="help">
    <kbd>Z</kbd> o <kbd>←</kbd> Flipper sinistro &nbsp;·&nbsp;
    <kbd>X</kbd> o <kbd>→</kbd> Flipper destro &nbsp;·&nbsp;
    <kbd>Spazio</kbd> Plunger
  </div>

  <div id="mobile">
    <button id="mLeft">SINISTRA</button>
    <button id="mLaunch">LANCIA</button>
    <button id="mRight">DESTRA</button>
  </div>

  <script>
    // ========== CONFIG ==========
    const W = 420, H = 680;
    const BALL_R = 11;
    const COLORS = {
      bg: '#0d1117', wall: '#2d3748', bumper: '#ed8936', bumperLit: '#fbd38d',
      flipper: '#e53e3e', ball: '#e2e8f0', sling: '#38b2ac', plunger: '#805ad5'
    };

    // ========== STATE ==========
    let engine, world, render, runner;
    let ball, leftFlip, rightFlip, plunger;
    let score = 0, ballsLeft = 3, highScore = 0;
    let started = false, inPlay = false, charging = false, power = 0;
    let leftDown = false, rightDown = false;

    const $score = document.getElementById('score');
    const $balls = document.getElementById('balls');
    const $high  = document.getElementById('high');
    const $overlay = document.getElementById('overlay');
    const $wrap = document.getElementById('game-wrap');

    try {
      highScore = parseInt(localStorage.getItem('flipHigh') || '0', 10);
      $high.textContent = highScore;
    } catch(e) {}

    // ========== INIT ==========
    function init() {
      if (typeof Matter === 'undefined') {
        $overlay.innerHTML = '<h2>Errore</h2><p>Matter.js non caricato.<br>Controlla la connessione internet.</p>';
        return;
      }

      engine = Matter.Engine.create();
      world = engine.world;
      world.gravity.y = 1.1;

      render = Matter.Render.create({
        element: $wrap,
        engine: engine,
        options: {
          width: W,
          height: H,
          wireframes: false,
          background: COLORS.bg,
          pixelRatio: window.devicePixelRatio > 1.5 ? 1.5 : 1
        }
      });
      Matter.Render.run(render);
      runner = Matter.Runner.create();
      Matter.Runner.run(runner, engine);

      buildTable();
      buildFlippers();
      buildPlunger();
      buildBumpers();
      buildSlingshots();
      buildDrain();

      Matter.Events.on(engine, 'collisionStart', onCollide);
      Matter.Events.on(engine, 'beforeUpdate', beforeUpdate);

      spawnReady();
      setupInput();
    }

    // ========== BUILD ==========
    function wall(x, y, w, h, angle) {
      return Matter.Bodies.rectangle(x, y, w, h, {
        isStatic: true,
        angle: angle || 0,
        restitution: 0.55,
        friction: 0.08,
        render: { fillStyle: COLORS.wall }
      });
    }

    function buildTable() {
      const walls = [
        wall(W/2, -10, W+40, 24),
        wall(-10, H/2, 24, H+40),
        wall(W+10, H/2, 24, H+40),
        wall(55, H-20, 110, 20),
        wall(W-55, H-20, 110, 20),
        wall(W-48, 360, 12, 320),
        wall(70, 130, 14, 90, 0.45),
        wall(W-90, 130, 14, 90, -0.45),
        wall(85, 560, 12, 80, 0.5),
        wall(W-85, 560, 12, 80, -0.5)
      ];
      Matter.World.add(world, walls);
    }

    function buildFlippers() {
      leftFlip = Matter.Bodies.rectangle(130, 615, 85, 16, {
        isStatic: true,
        restitution: 0.3,
        friction: 0.05,
        chamfer: { radius: 7 },
        label: 'flipper',
        render: { fillStyle: COLORS.flipper }
      });
      rightFlip = Matter.Bodies.rectangle(W-130, 615, 85, 16, {
        isStatic: true,
        restitution: 0.3,
        friction: 0.05,
        chamfer: { radius: 7 },
        label: 'flipper',
        render: { fillStyle: COLORS.flipper }
      });
      Matter.Body.setAngle(leftFlip, 0.5);
      Matter.Body.setAngle(rightFlip, -0.5);
      Matter.World.add(world, [leftFlip, rightFlip]);
    }

    function buildPlunger() {
      plunger = Matter.Bodies.rectangle(W-28, 590, 26, 70, {
        isStatic: true,
        restitution: 1.1,
        label: 'plunger',
        render: { fillStyle: COLORS.plunger }
      });
      Matter.World.add(world, plunger);
    }

    function buildBumpers() {
      [[150,200],[210,160],[270,200],[170,290],[250,290],[210,370]].forEach(([x,y]) => {
        const b = Matter.Bodies.circle(x, y, 26, {
          isStatic: true,
          restitution: 1.55,
          friction: 0.01,
          label: 'bumper',
          render: { fillStyle: COLORS.bumper }
        });
        b._lit = 0;
        Matter.World.add(world, b);
      });
    }

    function buildSlingshots() {
      Matter.World.add(world, [
        Matter.Bodies.trapezoid(80, 500, 60, 45, 0.35, {
          isStatic: true, angle: 0.35, restitution: 1.35, label: 'sling',
          render: { fillStyle: COLORS.sling }
        }),
        Matter.Bodies.trapezoid(W-80, 500, 60, 45, 0.35, {
          isStatic: true, angle: -0.35, restitution: 1.35, label: 'sling',
          render: { fillStyle: COLORS.sling }
        })
      ]);
    }

    function buildDrain() {
      Matter.World.add(world, Matter.Bodies.rectangle(W/2, H+25, 160, 30, {
        isStatic: true, isSensor: true, label: 'drain', render: { visible: false }
      }));
    }

    // ========== BALL ==========
    function spawnReady() {
      if (ball) Matter.World.remove(world, ball);
      ball = Matter.Bodies.circle(W-28, 530, BALL_R, {
        restitution: 0.65,
        friction: 0.02,
        frictionAir: 0.0015,
        density: 0.002,
        label: 'ball',
        render: { fillStyle: COLORS.ball }
      });
      Matter.Body.setStatic(ball, true);
      Matter.World.add(world, ball);
      inPlay = false;
      charging = false;
      power = 0;
      Matter.Body.setPosition(plunger, { x: W-28, y: 590 });
    }

    function launch() {
      if (inPlay || ballsLeft <= 0 || !started) return;
      Matter.Body.setStatic(ball, false);
      const p = 16 + power * 20;
      Matter.Body.setVelocity(ball, {
        x: -1.2 + Math.random() * 0.8,
        y: -p
      });
      inPlay = true;
      charging = false;
      power = 0;
      Matter.Body.setPosition(plunger, { x: W-28, y: 590 });
    }

    function loseBall() {
      if (!inPlay) return;
      inPlay = false;
      ballsLeft--;
      $balls.textContent = ballsLeft;
      if (ballsLeft <= 0) {
        gameOver();
      } else {
        setTimeout(spawnReady, 700);
      }
    }

    function gameOver() {
      try {
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('flipHigh', highScore);
          $high.textContent = highScore;
        }
      } catch(e) {}
      $overlay.innerHTML = `
        <h2>GAME OVER</h2>
        <p>Punteggio: <b>${score}</b></p>
        <p>Record: ${highScore}</p>
        <button id="startBtn">RIGIOCA</button>
      `;
      $overlay.classList.remove('hidden');
      started = false;
      document.getElementById('startBtn').onclick = startGame;
    }

    function startGame() {
      score = 0;
      ballsLeft = 3;
      $score.textContent = '0';
      $balls.textContent = '3';
      $overlay.classList.add('hidden');
      started = true;
      spawnReady();
    }

    // ========== UPDATE ==========
    function beforeUpdate() {
      const restL = 0.52, upL = -0.48;
      const restR = -0.52, upR = 0.48;

      if (leftDown) {
        Matter.Body.setAngle(leftFlip, upL);
      } else {
        Matter.Body.setAngle(leftFlip, restL);
      }
      if (rightDown) {
        Matter.Body.setAngle(rightFlip, upR);
      } else {
        Matter.Body.setAngle(rightFlip, restR);
      }

      Matter.Body.setPosition(leftFlip, { x: 130, y: 615 });
      Matter.Body.setPosition(rightFlip, { x: W-130, y: 615 });
      Matter.Body.setVelocity(leftFlip, { x:0, y:0 });
      Matter.Body.setVelocity(rightFlip, { x:0, y:0 });
      Matter.Body.setAngularVelocity(leftFlip, 0);
      Matter.Body.setAngularVelocity(rightFlip, 0);

      if (charging && !inPlay) {
        power = Math.min(power + 0.03, 1);
        const y = 590 + power * 65;
        Matter.Body.setPosition(plunger, { x: W-28, y: y });
        if (ball && ball.isStatic) {
          Matter.Body.setPosition(ball, { x: W-28, y: y - 48 });
        }
      }

      for (const b of world.bodies) {
        if (b.label === 'bumper' && b._lit > 0) {
          b._lit -= 0.05;
          b.render.fillStyle = b._lit > 0 ? COLORS.bumperLit : COLORS.bumper;
        }
      }

      if (ball && !ball.isStatic) {
        const v = ball.velocity;
        const s = Math.hypot(v.x, v.y);
        if (s > 26) {
          Matter.Body.setVelocity(ball, { x: v.x*26/s, y: v.y*26/s });
        }
      }
    }

    function onCollide(ev) {
      for (const p of ev.pairs) {
        let b = null, o = null;
        if (p.bodyA.label === 'ball') { b = p.bodyA; o = p.bodyB; }
        else if (p.bodyB.label === 'ball') { b = p.bodyB; o = p.bodyA; }
        if (!b) continue;

        if (o.label === 'bumper') {
          score += 100;
          $score.textContent = score;
          o._lit = 1;
          o.render.fillStyle = COLORS.bumperLit;
          const dx = b.position.x - o.position.x;
          const dy = b.position.y - o.position.y;
          const d = Math.hypot(dx, dy) || 1;
          Matter.Body.setVelocity(b, {
            x: b.velocity.x + dx/d * 3.5,
            y: b.velocity.y + dy/d * 3.5
          });
        } else if (o.label === 'sling') {
          score += 50;
          $score.textContent = score;
        } else if (o.label === 'drain') {
          loseBall();
        }
      }
    }

    // ========== INPUT ==========
    function setupInput() {
      document.getElementById('startBtn').onclick = startGame;

      window.addEventListener('keydown', e => {
        if (!started) {
          if (e.code === 'Space' || e.code === 'Enter') startGame();
          return;
        }
        if (e.code === 'ArrowLeft' || e.code === 'KeyZ' || e.code === 'KeyA') {
          leftDown = true; e.preventDefault();
        }
        if (e.code === 'ArrowRight' || e.code === 'KeyX' || e.code === 'KeyD') {
          rightDown = true; e.preventDefault();
        }
        if (e.code === 'Space') {
          if (!inPlay) charging = true;
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyZ' || e.code === 'KeyA') leftDown = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyX' || e.code === 'KeyD') rightDown = false;
        if (e.code === 'Space') {
          if (charging) launch();
          charging = false;
        }
      });

      const bind = (el, down, up) => {
        el.addEventListener('touchstart', e => { e.preventDefault(); down(); }, {passive:false});
        el.addEventListener('touchend',   e => { e.preventDefault(); up(); }, {passive:false});
        el.addEventListener('mousedown',  e => { e.preventDefault(); down(); });
        el.addEventListener('mouseup',    e => { e.preventDefault(); up(); });
        el.addEventListener('mouseleave', up);
      };
      bind(document.getElementById('mLeft'),   () => leftDown = true,  () => leftDown = false);
      bind(document.getElementById('mRight'),  () => rightDown = true, () => rightDown = false);
      bind(document.getElementById('mLaunch'), () => {
        if (!started) { startGame(); return; }
        if (!inPlay) charging = true;
      }, () => {
        if (charging) launch();
        charging = false;
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
