<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flipper Realistico</title>
  <script src="matter.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a12;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    h1 {
      font-size: 1.6rem;
      margin: 8px 0;
      letter-spacing: 3px;
      color: #ff6b35;
      text-shadow: 0 0 12px rgba(255,107,53,0.6);
    }
    #hud {
      display: flex;
      gap: 40px;
      margin-bottom: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    #hud span { color: #4ecdc4; }
    #container {
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 80px rgba(255,107,53,0.15);
      border-radius: 8px;
      overflow: hidden;
      border: 3px solid #333;
    }
    canvas { display: block; }
    #instructions {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
      opacity: 0.75;
      max-width: 480px;
      line-height: 1.5;
    }
    #instructions kbd {
      background: #333;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: monospace;
      border: 1px solid #555;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 10;
      font-size: 1.4rem;
      text-align: center;
      cursor: pointer;
    }
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 2.2rem; margin-bottom: 12px; color: #ff6b35; }
    #overlay p { opacity: 0.9; margin: 6px 0; }
    .btn-row {
      display: flex;
      gap: 20px;
      margin-top: 16px;
    }
    .mobile-btn {
      display: none;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #e64980;
      color: white;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      touch-action: none;
    }
    @media (max-width: 600px), (pointer: coarse) {
      .mobile-btn { display: flex; align-items: center; justify-content: center; }
      #instructions { font-size: 0.75rem; }
    }
    #mobile-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      justify-content: space-around;
      padding: 0 20px;
      z-index: 20;
    }
    @media (max-width: 600px), (pointer: coarse) {
      #mobile-controls { display: flex; }
      body { padding-bottom: 120px; }
    }
  </style>
</head>
<body>
  <h1>⚡ FLIPPER ⚡</h1>
  <div id="hud">
    <div>Punteggio: <span id="score">0</span></div>
    <div>Palline: <span id="balls">3</span></div>
    <div>Record: <span id="high">0</span></div>
  </div>
  <div id="container">
    <div id="overlay">
      <h2>FLIPPER REALISTICO</h2>
      <p>Tieni premuto <kbd>SPAZIO</kbd> per caricare il plunger</p>
      <p>Rilascia per lanciare la pallina</p>
      <p>Flipper: <kbd>←</kbd> / <kbd>Z</kbd> e <kbd>→</kbd> / <kbd>X</kbd></p>
      <p style="margin-top:18px;font-size:1rem;opacity:0.7">Clicca o premi un tasto per iniziare</p>
    </div>
  </div>
  <div id="instructions">
    <kbd>Z</kbd> / <kbd>←</kbd> Flipper sinistro &nbsp;|&nbsp;
    <kbd>X</kbd> / <kbd>→</kbd> Flipper destro &nbsp;|&nbsp;
    <kbd>Spazio</kbd> Plunger (tieni premuto)
  </div>
  <div id="mobile-controls">
    <button class="mobile-btn" id="btn-left">SINISTRA</button>
    <button class="mobile-btn" id="btn-launch">LANCIA</button>
    <button class="mobile-btn" id="btn-right">DESTRA</button>
  </div>

  <script>
    // ==================== CONFIG ====================
    const WIDTH = 480;
    const HEIGHT = 720;
    const GRAVITY = 1.05;
    const BALL_RADIUS = 12;
    const WALL_THICKNESS = 18;
    const COLOR = {
      bg: '#0d1117',
      wall: '#2d3748',
      wallInner: '#4a5568',
      bumper: '#ed8936',
      bumperLit: '#fbd38d',
      flipper: '#e53e3e',
      ball: '#e2e8f0',
      sling: '#38b2ac',
      plunger: '#805ad5',
      lane: '#1a202c'
    };

    // ==================== STATE ====================
    let engine, world, render, runner;
    let ball, leftFlipper, rightFlipper, plunger;
    let leftHinge, rightHinge;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flipperHigh') || '0');
    let ballsLeft = 3;
    let gameStarted = false;
    let ballInPlay = false;
    let plungerPower = 0;
    let isCharging = false;
    let leftPressed = false;
    let rightPressed = false;
    let bumperHits = new Map();

    // DOM
    const scoreEl = document.getElementById('score');
    const ballsEl = document.getElementById('balls');
    const highEl = document.getElementById('high');
    const overlay = document.getElementById('overlay');
    const container = document.getElementById('container');

    highEl.textContent = highScore;

    // ==================== MATTER SETUP ====================
    function init() {
      engine = Matter.Engine.create();
      world = engine.world;
      world.gravity.y = GRAVITY;

      render = Matter.Render.create({
        element: container,
        engine: engine,
        options: {
          width: WIDTH,
          height: HEIGHT,
          wireframes: false,
          background: COLOR.bg,
          pixelRatio: Math.min(window.devicePixelRatio || 1, 2)
        }
      });

      Matter.Render.run(render);
      runner = Matter.Runner.create();
      Matter.Runner.run(runner, engine);

      createTable();
      createFlippers();
      createPlunger();
      createBumpers();
      createSlingshots();
      createSensors();

      // Events
      Matter.Events.on(engine, 'collisionStart', onCollision);
      Matter.Events.on(engine, 'beforeUpdate', onBeforeUpdate);

      // Input
      setupInput();

      // Start with ball ready
      spawnBallReady();
    }

    // ==================== TABLE ====================
    function createTable() {
      const walls = [];

      // Outer walls
      walls.push(wall(WIDTH/2, -WALL_THICKNESS/2, WIDTH + 40, WALL_THICKNESS)); // top
      walls.push(wall(-WALL_THICKNESS/2, HEIGHT/2, WALL_THICKNESS, HEIGHT + 40)); // left
      walls.push(wall(WIDTH + WALL_THICKNESS/2, HEIGHT/2, WALL_THICKNESS, HEIGHT + 40)); // right

      // Bottom drain walls (left and right of drain)
      walls.push(wall(70, HEIGHT - 30, 140, WALL_THICKNESS));
      walls.push(wall(WIDTH - 70, HEIGHT - 30, 140, WALL_THICKNESS));

      // Left side curve-ish (sloped walls)
      walls.push(wall(30, 480, 20, 180, 0.25)); // left lower
      walls.push(wall(WIDTH - 30, 480, 20, 180, -0.25)); // right lower (but leave lane)

      // Plunger lane wall (right side)
      walls.push(wall(WIDTH - 55, 380, 14, 340));

      // Upper arches / guides
      walls.push(wall(80, 120, 16, 100, 0.4));
      walls.push(wall(WIDTH - 120, 120, 16, 100, -0.4));

      // Top dome-ish
      walls.push(wall(WIDTH/2, 40, 200, 16));

      // Lane blockers / guides near flippers
      walls.push(wall(95, 580, 14, 90, 0.55));
      walls.push(wall(WIDTH - 95, 580, 14, 90, -0.55));

      Matter.World.add(world, walls);
    }

    function wall(x, y, w, h, angle = 0) {
      return Matter.Bodies.rectangle(x, y, w, h, {
        isStatic: true,
        angle: angle,
        restitution: 0.6,
        friction: 0.1,
        render: { fillStyle: COLOR.wall, strokeStyle: '#1a202c', lineWidth: 1 }
      });
    }

    // ==================== FLIPPERS ====================
    function createFlippers() {
      const flipperOpts = {
        density: 0.04,
        restitution: 0.4,
        friction: 0.05,
        frictionAir: 0.02,
        render: { fillStyle: COLOR.flipper }
      };

      // Left flipper
      leftFlipper = Matter.Bodies.rectangle(145, 640, 90, 18, {
        ...flipperOpts,
        chamfer: { radius: 8 },
        label: 'flipper'
      });
      leftHinge = Matter.Constraint.create({
        bodyA: leftFlipper,
        pointA: { x: -35, y: 0 },
        pointB: { x: 110, y: 640 },
        stiffness: 1,
        length: 0,
        render: { visible: false }
      });

      // Right flipper
      rightFlipper = Matter.Bodies.rectangle(WIDTH - 145, 640, 90, 18, {
        ...flipperOpts,
        chamfer: { radius: 8 },
        label: 'flipper'
      });
      rightHinge = Matter.Constraint.create({
        bodyA: rightFlipper,
        pointA: { x: 35, y: 0 },
        pointB: { x: WIDTH - 110, y: 640 },
        stiffness: 1,
        length: 0,
        render: { visible: false }
      });

      // Rest angle stoppers (invisible)
      const leftStop = Matter.Bodies.rectangle(160, 665, 40, 10, {
        isStatic: true, isSensor: true, render: { visible: false }
      });
      const rightStop = Matter.Bodies.rectangle(WIDTH - 160, 665, 40, 10, {
        isStatic: true, isSensor: true, render: { visible: false }
      });

      Matter.World.add(world, [leftFlipper, rightFlipper, leftHinge, rightHinge, leftStop, rightStop]);

      // Initial rest angle
      Matter.Body.setAngle(leftFlipper, 0.45);
      Matter.Body.setAngle(rightFlipper, -0.45);
    }

    // ==================== PLUNGER ====================
    function createPlunger() {
      plunger = Matter.Bodies.rectangle(WIDTH - 28, 620, 28, 80, {
        isStatic: true,
        restitution: 1.2,
        friction: 0.1,
        label: 'plunger',
        render: { fillStyle: COLOR.plunger }
      });
      Matter.World.add(world, plunger);
    }

    // ==================== BUMPERS ====================
    function createBumpers() {
      const positions = [
        [160, 220], [240, 180], [320, 220],
        [180, 320], [300, 320],
        [240, 400]
      ];
      positions.forEach(([x, y], i) => {
        const b = Matter.Bodies.circle(x, y, 28, {
          isStatic: true,
          restitution: 1.6,
          friction: 0.01,
          label: 'bumper',
          render: { fillStyle: COLOR.bumper }
        });
        b.plugin = { index: i, lit: 0 };
        Matter.World.add(world, b);
      });
    }

    // ==================== SLINGSHOTS ====================
    function createSlingshots() {
      // Left sling
      const leftSling = Matter.Bodies.trapezoid(95, 520, 70, 50, 0.4, {
        isStatic: true,
        angle: 0.4,
        restitution: 1.4,
        label: 'sling',
        render: { fillStyle: COLOR.sling }
      });
      // Right sling
      const rightSling = Matter.Bodies.trapezoid(WIDTH - 95, 520, 70, 50, 0.4, {
        isStatic: true,
        angle: -0.4,
        restitution: 1.4,
        label: 'sling',
        render: { fillStyle: COLOR.sling }
      });
      Matter.World.add(world, [leftSling, rightSling]);
    }

    // ==================== SENSORS ====================
    function createSensors() {
      // Drain sensor
      const drain = Matter.Bodies.rectangle(WIDTH/2, HEIGHT + 30, 180, 40, {
        isStatic: true,
        isSensor: true,
        label: 'drain',
        render: { visible: false }
      });
      Matter.World.add(world, drain);
    }

    // ==================== BALL ====================
    function spawnBallReady() {
      if (ball) {
        Matter.World.remove(world, ball);
      }
      ball = Matter.Bodies.circle(WIDTH - 28, 560, BALL_RADIUS, {
        restitution: 0.7,
        friction: 0.02,
        frictionAir: 0.001,
        density: 0.002,
        label: 'ball',
        render: { fillStyle: COLOR.ball }
      });
      // Keep it resting on plunger area
      Matter.Body.setStatic(ball, true);
      Matter.World.add(world, ball);
      ballInPlay = false;
      plungerPower = 0;
      isCharging = false;
    }

    function launchBall() {
      if (ballInPlay || ballsLeft <= 0) return;
      Matter.Body.setStatic(ball, false);
      const power = 18 + plungerPower * 22;
      Matter.Body.setVelocity(ball, { x: -1.5 + Math.random()*1, y: -power });
      Matter.Body.setAngularVelocity(ball, 0);
      ballInPlay = true;
      plungerPower = 0;
      isCharging = false;
      // Reset plunger position
      Matter.Body.setPosition(plunger, { x: WIDTH - 28, y: 620 });
    }

    function loseBall() {
      ballsLeft--;
      ballsEl.textContent = ballsLeft;
      ballInPlay = false;
      if (ballsLeft <= 0) {
        gameOver();
      } else {
        setTimeout(() => {
          spawnBallReady();
        }, 800);
      }
    }

    function gameOver() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flipperHigh', highScore);
        highEl.textContent = highScore;
      }
      overlay.innerHTML = `
        <h2>GAME OVER</h2>
        <p>Punteggio: ${score}</p>
        <p>Record: ${highScore}</p>
        <p style="margin-top:16px;font-size:1rem">Clicca per riavviare</p>
      `;
      overlay.classList.remove('hidden');
      gameStarted = false;
    }

    function restart() {
      score = 0;
      ballsLeft = 3;
      scoreEl.textContent = '0';
      ballsEl.textContent = '3';
      overlay.classList.add('hidden');
      gameStarted = true;
      spawnBallReady();
    }

    // ==================== PHYSICS UPDATE ====================
    function onBeforeUpdate() {
      // Flipper control
      const flipForce = 0.18;
      const restLeft = 0.48;
      const restRight = -0.48;
      const maxLeft = -0.55;
      const maxRight = 0.55;

      if (leftPressed) {
        Matter.Body.setAngularVelocity(leftFlipper, -0.55);
      } else {
        // Return to rest
        const ang = leftFlipper.angle;
        if (ang < restLeft) {
          Matter.Body.setAngularVelocity(leftFlipper, 0.25);
        } else {
          Matter.Body.setAngularVelocity(leftFlipper, 0);
          Matter.Body.setAngle(leftFlipper, restLeft);
        }
      }

      if (rightPressed) {
        Matter.Body.setAngularVelocity(rightFlipper, 0.55);
      } else {
        const ang = rightFlipper.angle;
        if (ang > restRight) {
          Matter.Body.setAngularVelocity(rightFlipper, -0.25);
        } else {
          Matter.Body.setAngularVelocity(rightFlipper, 0);
          Matter.Body.setAngle(rightFlipper, restRight);
        }
      }

      // Clamp flipper angles roughly
      if (leftFlipper.angle < maxLeft) Matter.Body.setAngle(leftFlipper, maxLeft);
      if (leftFlipper.angle > restLeft + 0.1) Matter.Body.setAngle(leftFlipper, restLeft);
      if (rightFlipper.angle > maxRight) Matter.Body.setAngle(rightFlipper, maxRight);
      if (rightFlipper.angle < restRight - 0.1) Matter.Body.setAngle(rightFlipper, restRight);

      // Plunger charge
      if (isCharging && !ballInPlay) {
        plungerPower = Math.min(plungerPower + 0.025, 1);
        const y = 620 + plungerPower * 70;
        Matter.Body.setPosition(plunger, { x: WIDTH - 28, y: y });
        // Keep ball on top of plunger
        if (ball && ball.isStatic) {
          Matter.Body.setPosition(ball, { x: WIDTH - 28, y: y - 50 });
        }
      }

      // Bumper light fade
      for (const body of world.bodies) {
        if (body.label === 'bumper' && body.plugin && body.plugin.lit > 0) {
          body.plugin.lit -= 0.04;
          body.render.fillStyle = body.plugin.lit > 0 ? COLOR.bumperLit : COLOR.bumper;
        }
      }

      // Cap ball speed
      if (ball && !ball.isStatic) {
        const v = ball.velocity;
        const speed = Math.sqrt(v.x*v.x + v.y*v.y);
        if (speed > 28) {
          const scale = 28 / speed;
          Matter.Body.setVelocity(ball, { x: v.x * scale, y: v.y * scale });
        }
      }
    }

    function onCollision(event) {
      const pairs = event.pairs;
      for (const pair of pairs) {
        let ballBody = null;
        let other = null;
        if (pair.bodyA.label === 'ball') { ballBody = pair.bodyA; other = pair.bodyB; }
        else if (pair.bodyB.label === 'ball') { ballBody = pair.bodyB; other = pair.bodyA; }
        if (!ballBody) continue;

        if (other.label === 'bumper') {
          addScore(100);
          other.plugin.lit = 1;
          other.render.fillStyle = COLOR.bumperLit;
          // Extra bounce boost
          const dx = ballBody.position.x - other.position.x;
          const dy = ballBody.position.y - other.position.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          Matter.Body.setVelocity(ballBody, {
            x: ballBody.velocity.x + (dx / dist) * 4,
            y: ballBody.velocity.y + (dy / dist) * 4
          });
        } else if (other.label === 'sling') {
          addScore(50);
        } else if (other.label === 'drain') {
          if (ballInPlay) loseBall();
        } else if (other.label === 'flipper') {
          // slight score for skill
          // no score
        }
      }
    }

    function addScore(pts) {
      score += pts;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highEl.textContent = highScore;
        localStorage.setItem('flipperHigh', highScore);
      }
    }

    // ==================== INPUT ====================
    function setupInput() {
      window.addEventListener('keydown', e => {
        if (!gameStarted) {
          restart();
          return;
        }
        if (e.code === 'ArrowLeft' || e.code === 'KeyZ' || e.code === 'KeyA') {
          leftPressed = true;
          e.preventDefault();
        }
        if (e.code === 'ArrowRight' || e.code === 'KeyX' || e.code === 'KeyD') {
          rightPressed = true;
          e.preventDefault();
        }
        if (e.code === 'Space') {
          if (!ballInPlay) {
            isCharging = true;
          }
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyZ' || e.code === 'KeyA') {
          leftPressed = false;
        }
        if (e.code === 'ArrowRight' || e.code === 'KeyX' || e.code === 'KeyD') {
          rightPressed = false;
        }
        if (e.code === 'Space') {
          if (isCharging && !ballInPlay) {
            launchBall();
          }
          isCharging = false;
        }
      });

      // Click to start
      overlay.addEventListener('click', () => {
        if (!gameStarted) restart();
      });

      // Mobile
      const btnL = document.getElementById('btn-left');
      const btnR = document.getElementById('btn-right');
      const btnLaunch = document.getElementById('btn-launch');

      function bindBtn(btn, on, off) {
        btn.addEventListener('touchstart', e => { e.preventDefault(); on(); }, {passive:false});
        btn.addEventListener('touchend', e => { e.preventDefault(); off(); }, {passive:false});
        btn.addEventListener('mousedown', e => { e.preventDefault(); on(); });
        btn.addEventListener('mouseup', e => { e.preventDefault(); off(); });
        btn.addEventListener('mouseleave', off);
      }

      bindBtn(btnL, () => leftPressed = true, () => leftPressed = false);
      bindBtn(btnR, () => rightPressed = true, () => rightPressed = false);
      bindBtn(btnLaunch, () => {
        if (!gameStarted) { restart(); return; }
        if (!ballInPlay) isCharging = true;
      }, () => {
        if (isCharging && !ballInPlay) launchBall();
        isCharging = false;
      });
    }

    // ==================== START ====================
    init();
  </script>
</body>
</html>
